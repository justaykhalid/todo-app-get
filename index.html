<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styl.css">
    <title>To Do</title>
</head>

<body>
    <div class="open_page">
        <div class="top">
            <h1>To Do</h1>
            <span>Stay ahead</span>
        </div>
        <div class="bottom">
            <button class="initiate_button" type="button">Start</button>
        </div>
    </div>
    <div class="app">
        <section>
            <h2 class="my_task_txt">My Task</h2>
        </section>
        <section class="task_display">

        </section>
        <div class="new_task_section">
            <input type="text" placeholder="New Task" class="new_task_input">
            <button class="add_btn">&#43</button>
        </div>

    </div>
    <script src="index.js"></script>
</body>

</html>
